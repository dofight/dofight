# On a version tag (vX.Y.Z): builds the signed Windows installer and the Mac .dmg side by side, then publishes both,
# with latest.json for the auto-updater, to this repository's releases in one go. A release is held back when either
# build fails (owner, 2026-11-26): nothing is published, the tag is fixed or moved and the workflow run again. The two
# builds used to run one after the other, Mac after Windows, about 20 minutes a release; side by side it is the
# slower of the two plus the publishing.
# The repository variable MAC_RELEASE is « true » since 1.12.0 (owner, 2026-11-23: every release ships both). Unset,
# a tag publishes Windows only. « only_macos » rebuilds the Mac files alone and adds them to a release already out.
# Publishing uses the gh CLI, which also writes latest.json and the plain exe for the auto-updater.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v1.0.1"
        required: true
      only_macos:
        description: "Rebuild only the Mac files (the Windows ones are already published)"
        type: boolean
        default: false

jobs:
  windows:
    if: ${{ !inputs.only_macos }}
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm vitest run
        working-directory: app

      - name: Version matches the tag
        shell: bash
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          test "v$v" = "$TAG" || { echo "tauri.conf.json says $v but the tag is $TAG"; exit 1; }

      - name: Build the signed installer
        working-directory: app
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOFIGHT_WEBHOOK: ${{ secrets.DOFIGHT_WEBHOOK }} # Discord #suggestions-in-app webhook; empty = the « Suggestion » button says it is not set up

      # the plain exe, signed like the installer: a copy kept outside the install folder (Desktop) replaces its own
      # exe with it (selfupdate.rs), so its path and shortcuts stay
      - name: Sign the plain exe
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          v="${TAG#v}"
          cp src-tauri/target/release/dofight.exe "src-tauri/target/release/bundle/nsis/Dofight_${v}_x64.exe"
          pnpm tauri signer sign "src-tauri/target/release/bundle/nsis/Dofight_${v}_x64.exe"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # handed to the « publish » job, which waits for the Mac files before anything goes out
      - name: The files to publish
        shell: bash
        run: |
          set -euo pipefail
          v="${TAG#v}"
          dir=app/src-tauri/target/release/bundle/nsis
          mkdir out
          for f in "Dofight_${v}_x64-setup.exe" "Dofight_${v}_x64.exe"; do
            cp "$dir/$f" "$dir/$f.sig" out/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/
          if-no-files-found: error
          retention-days: 7

  # the Mac .dmg (Apple silicon and Intel, signed with the project's own certificate: no Apple account, not
  # notarised) and the updater's .app.tar.gz, built while Windows builds
  macos:
    if: ${{ inputs.only_macos || vars.MAC_RELEASE == 'true' }}
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # a flag and not the certificate: a step's « if » cannot read the secrets, and the job's env is handed to
      # everything the job runs — pnpm's install scripts, every build.rs, the actions
      MAC_SIGN: ${{ secrets.MAC_SIGN_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Version matches the tag
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          test "v$v" = "$TAG" || { echo "tauri.conf.json says $v but the tag is $TAG"; exit 1; }

      # macOS books « Enregistrement de l'écran » against the code's designated requirement. Signed ad-hoc that
      # requirement is the binary's own hash, so every update is a new app to it and the player, still ticked in the
      # settings, silently stops being read. Signed with one certificate it is « identifier app.dofight and
      # certificate root = H"…" », which does not move. The certificate is self-signed and never has to be trusted:
      # it only has to stay the same (owner, 2026-11-22, measured on a Mac over two builds).
      - name: The signing certificate
        if: env.MAC_SIGN == 'true'
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/dofight.keychain-db"
          pw=$(openssl rand -base64 18)
          echo "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          # the .p12 has to be written by `openssl pkcs12 -export -legacy`: OpenSSL 3's own encryption is refused
          # here, and the error says « MAC verification failed (wrong password?) » whatever the password is
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          # codesign looks the identity up in the keychains it searches, not in the one it is handed
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build the .dmg and the updater files
        working-directory: app
        run: pnpm tauri build --target universal-apple-darwin --bundles app dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOFIGHT_WEBHOOK: ${{ secrets.DOFIGHT_WEBHOOK }}
          # tauri.conf.json stays on « - », so a Mac without the certificate still builds; this overrides it
          APPLE_SIGNING_IDENTITY: ${{ secrets.MAC_SIGN_P12 != '' && 'Dofight Release' || '-' }}

      - name: The build is signed with the certificate, not ad-hoc
        if: env.MAC_SIGN == 'true'
        run: |
          set -euo pipefail
          app=app/src-tauri/target/universal-apple-darwin/release/bundle/macos/Dofight.app
          codesign --verify --deep --strict --verbose=2 "$app"
          # both halves of a universal bundle, not just the one this runner happens to be
          for arch in x86_64 arm64; do
            req=$(codesign -d -r- --arch "$arch" "$app" 2>&1 | grep designated)
            echo "$arch: $req"
            # a cdhash here means the grant would be lost at the next update: the whole point of the step above
            case "$req" in *cdhash*) echo "signed ad-hoc: the screen-recording grant would not survive"; exit 1;; esac
            case "$req" in *"certificate root"*|*"certificate leaf"*) ;; *) echo "unexpected requirement"; exit 1;; esac
          done

      # handed to the « publish » job under their release names
      - name: The files to publish
        run: |
          set -euo pipefail
          v="${TAG#v}"
          out=app/src-tauri/target/universal-apple-darwin/release/bundle
          mkdir publish
          cp "$out/dmg/"*.dmg "publish/Dofight_${v}_universal.dmg"
          cp "$out/macos/Dofight.app.tar.gz" "publish/Dofight_${v}_universal.app.tar.gz"
          cp "$out/macos/Dofight.app.tar.gz.sig" "publish/Dofight_${v}_universal.app.tar.gz.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: publish/
          if-no-files-found: error
          retention-days: 7

  # Publishes what was built, all at once: the release, its files and latest.json appear together, so no installed
  # Dofight is told about a version whose files are not there yet. Held back when either build failed or was cancelled
  # (owner, 2026-11-26); a build skipped on purpose (MAC_RELEASE unset, « only_macos ») does not hold it.
  publish:
    needs: [windows, macos]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.windows.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishing to this repo itself, once it is the release repo
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish the release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS: ${{ needs.windows.result }}
          MACOS: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          url() { echo "https://github.com/$RELEASE_REPO/releases/download/$TAG/$1"; }
          notes="docs/release-notes/$TAG.md"
          exe="Dofight_${v}_x64-setup.exe"
          plain="Dofight_${v}_x64.exe"
          [ -f "$notes" ] || { notes=$(mktemp); echo "Download \`$exe\` and run it. Dofight then updates itself." > "$notes"; }
          upload=()
          if [ "$WINDOWS" = success ]; then
            for f in "$exe" "$exe.sig" "$plain" "$plain.sig"; do test -f "files/$f"; upload+=("files/$f"); done
            # latest.json: what the auto-updater of every installed Dofight reads
            node -e '
              const fs = require("fs");
              const [v, notesFile, out, exeUrl, exeSig, plainUrl, plainSig] = process.argv.slice(1);
              fs.writeFileSync(out, JSON.stringify({
                version: v,
                notes: (fs.readFileSync(notesFile, "utf8").split("\n").find((l) => l.trim()) || "").trim(),
                pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
                platforms: {
                  "windows-x86_64": { signature: fs.readFileSync(exeSig, "utf8").trim(), url: exeUrl },
                  // a copy outside the install folder: the plain exe (selfupdate.rs PORTABLE_TARGET)
                  "windows-x86_64-portable": { signature: fs.readFileSync(plainSig, "utf8").trim(), url: plainUrl },
                },
              }, null, 2));
            ' "$v" "$notes" files/latest.json "$(url "$exe")" "files/$exe.sig" "$(url "$plain")" "files/$plain.sig"
          else
            # « only_macos »: the Windows half is already out, its latest.json gets the darwin entries
            gh release download "$TAG" -R "$RELEASE_REPO" -p latest.json -D files --clobber
          fi
          if [ "$MACOS" = success ]; then
            app="Dofight_${v}_universal.app.tar.gz"
            for f in "Dofight_${v}_universal.dmg" "$app" "$app.sig"; do test -f "files/$f"; upload+=("files/$f"); done
            # the darwin entries next to Windows' (one universal bundle for both processors)
            node -e '
              const [url, sig] = process.argv.slice(1);
              const entry = { signature: sig, url };
              require("fs").writeFileSync("mac-platforms.json", JSON.stringify({ "darwin-aarch64": entry, "darwin-x86_64": entry }));
            ' "$(url "$app")" "$(cat "files/$app.sig")"
            node tools/merge_latest.mjs files/latest.json mac-platforms.json
          fi
          upload+=(files/latest.json)
          if gh release view "$TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$RELEASE_REPO" --clobber "${upload[@]}"
          else
            gh release create "$TAG" -R "$RELEASE_REPO" --target main --title "Dofight $TAG" --notes-file "$notes" \
              "${upload[@]}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "https://github.com/$RELEASE_REPO/releases/tag/$TAG"

      # a new release (not a re-run) is announced on the Discord: the notes in French and English, and a link
      - name: Announce on Discord
        if: steps.publish.outputs.created == 'true'
        continue-on-error: true # the release is already out: a Discord hiccup must not mark it failed
        env:
          WEBHOOK: ${{ secrets.DOFIGHT_ANNOUNCE_WEBHOOK }} # the #annonces webhook; empty = no announcement
        run: |
          set -euo pipefail
          [ -n "$WEBHOOK" ] || { echo "No DOFIGHT_ANNOUNCE_WEBHOOK: not announced"; exit 0; }
          notes="docs/release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "No release notes: not announced"; exit 0; }
          node tools/announce.mjs "$TAG" "$notes" announce.json
          curl -fsS -H "Content-Type: application/json" -d @announce.json "$WEBHOOK"
          echo "Announced on Discord"
