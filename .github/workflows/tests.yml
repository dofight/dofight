# Runs the three test suites on every pull request and push to main. No secret is used (pull requests from forks
# never get secrets); building, signing and publishing stay in the tag-only `release` workflow. The `macos` job also
# builds an unsigned test .dmg (an artifact to download), on pushes to main and to the `macos` branch.
name: tests

on:
  pull_request:
  push:
    branches: [main, macos]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release notes check reads the pushed commits
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: App (TypeScript)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit -p .
          pnpm vitest run
      - name: Suggestion relay (Cloudflare Worker)
        run: node --test relay/worker.test.mjs
      # the screen tests read French captures with Windows' own OCR, whose French pack runners lack
      - name: French OCR for Windows
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online -Name "Language.OCR~~~fr-FR~0.0.1.0"
          if ($cap.State -ne "Installed") { Add-WindowsCapability -Online -Name "Language.OCR~~~fr-FR~0.0.1.0" | Out-Null }
      - name: App (Rust)
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Tools and summaries (Python)
        run: |
          python -m pip install pytest
          python -m pytest -q tests
          python -m tools.summaries validate
      # a commit that changes what players see carries Notes-fr / Notes-en lines or « Notes: none » (CONTRIBUTING.md)
      - name: Release notes lines
        shell: bash
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then echo "new branch: nothing to compare"; exit 0; fi
          python -m tools.release_notes --check-range "$BEFORE..HEAD"

  # macOS (not a required check yet): the Rust tests, then a test .dmg (Apple silicon and Intel, ad-hoc signed, no
  # updater files: no secret here) to download from the run's artifacts
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: App (Rust)
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Test .dmg
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --target universal-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: dofight-macos-dmg
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
