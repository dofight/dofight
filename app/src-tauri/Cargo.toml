[package]
name = "dofight"
version = "1.14.0"
description = "Dofight"
authors = ["Dofight"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dofight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }


# macOS: AppKit (the panel, the menu bar), and later CoreGraphics, ScreenCaptureKit and Vision for the reading
[target.'cfg(target_os = "macos")'.dependencies]
# the overlay windows become non-activating NSPanels (platform/mac.rs): not on crates.io, so a git branch
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
core-foundation = "0.10"
core-graphics = "0.24"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = "0.3"
block2 = "0.6"
objc2-vision = "0.3"
foreign-types = "0.5"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"

# dev mode: the screen reading (pixel loops) runs several times a second, too slow unoptimized
[profile.dev.package.dofight]
opt-level = 2
